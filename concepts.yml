- id: realization-coefficient
  ko: 실현계수
  en: Realization Coefficient
  definition: AI로 줄어든 시간이나 비용 가운데 실제로 조직의 손익에 잡히는 비율. 0에서 1 사이 값을 가진다.
  description: "잠재 절감액 = 작업당 절감시간 × 연간 빈도 × 시간당 인건비 × 실현계수. 절감을 회수하는 결정(채용 보류, 외주 축소, 감원)이 실제로 있으면 0.7~1.0, 아무 결정 없이 흩어지는 여유시간이면 0이다. 프로젝트 전체가 아니라 업무 항목 단위로 따로 계산한다. AI 도입 효과 추정 대부분은 이 값을 암묵적으로 1.0으로 가정한다."
