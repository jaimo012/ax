<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
{% if page.canonical %}
  <link rel="canonical" href="{{ page.canonical }}" />
{% endif %}
  <meta property="og:site_name" content="{{ site.site_name }}" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:type" content="{{ page.og_type }}" />
  <meta property="og:title" content="{{ page.title }}" />
  <meta property="og:description" content="{{ page.description }}" />
{% if page.canonical %}
  <meta property="og:url" content="{{ page.canonical }}" />
{% endif %}
  <meta name="author" content="{{ site.author_name }}" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.site_name }}" href="{{ urls.path('feed.xml') }}" />
  <link rel="alternate" type="text/plain" title="llms.txt" href="{{ urls.path('llms.txt') }}" />
  <link rel="sitemap" type="application/xml" href="{{ urls.path('sitemap.xml') }}" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" />
  <link rel="stylesheet" href="{{ urls.path('static/style.css') }}" />
{% for block in page.jsonld %}
  <script type="application/ld+json">
{{ block | safe }}
  </script>
{% endfor %}
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ urls.path() }}">{{ site.site_name }}</a>
      <nav class="site-nav" aria-label="사이트 메뉴">
        <a href="{{ urls.path() }}">글 목록</a>
        <a href="{{ urls.path('glossary/') }}">개념 사전</a>
      </nav>
    </div>
  </header>
  <main class="wrap main">
{% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <span class="site-footer__name">{{ site.site_name }}</span>
      <a href="{{ urls.path('feed.xml') }}">RSS</a>
      <span class="site-footer__copy">© {{ year }} {{ site.author_name }}</span>
    </div>
  </footer>
</body>
</html>
